<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Massive Stock Watchlist</title>
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; 
      max-width: 900px; 
      margin: 0 auto; 
      padding: 40px 20px;
      color: #1a1a1a; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    
    h1 { 
      font-size: 32px; 
      font-weight: 700;
      color: #667eea;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    
    .hint { 
      color: #666; 
      font-size: 14px; 
      line-height: 1.6;
      margin-bottom: 32px;
      padding: 12px 16px;
      background: #f8f9fa;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }
    
    label { 
      display: block; 
      margin-bottom: 8px; 
      font-weight: 600; 
      color: #333;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    input[type="text"] { 
      width: 100%; 
      padding: 14px 16px; 
      font-size: 16px;
      border: 2px solid #e1e4e8; 
      border-radius: 8px;
      transition: all 0.3s ease;
      font-family: inherit;
    }
    
    input[type="text"]:focus { 
      outline: none; 
      border-color: #667eea; 
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    button { 
      margin-top: 20px; 
      padding: 14px 32px; 
      font-size: 16px;
      font-weight: 600;
      color: white; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none; 
      border-radius: 8px; 
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
      letter-spacing: 0.3px;
    }
    
    button:hover { 
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    #result { 
      margin-top: 24px; 
      padding: 16px 20px; 
      background: #f0f4ff; 
      border-radius: 8px; 
      min-height: 20px;
      font-size: 14px;
      line-height: 1.6;
      border-left: 4px solid #667eea;
      color: #333;
    }
    
    table { 
      width: 100%; 
      margin-top: 40px; 
      border-collapse: separate;
      border-spacing: 0;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    
    thead {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    th { 
      text-align: left; 
      padding: 16px 20px; 
      font-size: 12px; 
      color: white;
      text-transform: uppercase; 
      font-weight: 700;
      letter-spacing: 1px;
    }
    
    td { 
      text-align: left; 
      padding: 16px 20px; 
      border-bottom: 1px solid #e1e4e8;
      font-size: 15px;
    }
    
    tbody tr {
      transition: all 0.2s ease;
      background: white;
    }
    
    tbody tr:hover { 
      background: #f8f9fa;
      transform: scale(1.01);
    }
    
    tbody tr:last-child td {
      border-bottom: none;
    }
    
    @media (max-width: 768px) {
      body { padding: 20px 16px; }
      .container { padding: 24px; }
      h1 { font-size: 24px; }
      th, td { padding: 12px; font-size: 13px; }
    }
    
    .delete-btn {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(255, 107, 107, 0.3);
    }
    
    .delete-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
      background: linear-gradient(135deg, #ff5252 0%, #e63946 100%);
    }
    
    .delete-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
<h1>Stock Watchlist</h1>
  <p class="hint">Enter a single ticker symbol. This sends exactly ONE call to the Massive API to fetch the latest price, then adds it to your watchlist.</p>

  <form id="stock-form">
    <label for="symbol">Ticker symbol</label>
    <input type="text" id="symbol" name="symbol" placeholder="AAPL" required>
    <button type="submit">Add to watchlist</button>
  </form>

  <div id="result"></div>

  <table id="watchlist-table">
    <thead>
      <tr>
        <th>Symbol</th>
        <th>Email</th>
        <th>Latest price</th>
        <th>Updated</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="watchlist-body"></tbody>
  </table>
  </div>

<script>
    const form = document.getElementById("stock-form");
    const resultEl = document.getElementById("result");
    const watchlistBody = document.getElementById("watchlist-body");

    async function loadWatchlist() {
      try {
        const resp = await fetch("/watchlist");
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error loading watchlist: " + (data.error || resp.statusText);
          return;
        }
        watchlistBody.innerHTML = "";
        data.forEach((row) => {
          const tr = document.createElement("tr");
          const price = row.latest_price !== null && row.latest_price !== undefined
            ? Number(row.latest_price).toFixed(2)
            : "-";
          const updated = row.updated_at ? new Date(row.updated_at).toLocaleString() : "-";
          tr.innerHTML = `<td>${row.symbol}</td><td>${row.email || "-"}</td><td>$${price}</td><td>${updated}</td><td><button class="delete-btn" onclick="deleteSymbol('${row.symbol}')">Delete</button></td>`;
          watchlistBody.appendChild(tr);
        });
      } catch (err) {
        resultEl.textContent = "Failed to load watchlist: " + err;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const symbol = document.getElementById("symbol").value;
      resultEl.textContent = "Adding to watchlist...";

      try {
        const resp = await fetch("/watchlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error: " + (data.error || resp.statusText);
          return;
        }
        resultEl.textContent = "Added " + data.symbol + " at price " + data.latest_price;
        document.getElementById("symbol").value = "";
    
    async function deleteSymbol(symbol) {
      if (!confirm(`Are you sure you want to remove ${symbol} from your watchlist?`)) {
        return;
      }
      
      try {
        const resp = await fetch(`/watchlist/${symbol}`, {
          method: "DELETE",
        });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error deleting: " + (data.error || resp.statusText);
          return;
        }
        resultEl.textContent = `Removed ${data.deleted} from watchlist`;
        loadWatchlist();
      } catch (err) {
        resultEl.textContent = "Failed to delete: " + err;
      }
    }

        loadWatchlist();
      } catch (err) {
        resultEl.textContent = "Request failed: " + err;
      }
    });

    loadWatchlist();
  </script>
</body>
</html>
